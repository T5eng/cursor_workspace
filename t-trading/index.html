<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>做T量化分析 · T-Point Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand">
        <span class="logo">T</span>
        <div>
          <h1>做T量化分析</h1>
          <p class="subtitle">日内高抛低吸点位 · 纯前端 · 东方财富数据</p>
        </div>
      </div>
      <a class="back-link" href="../">← 返回主站</a>
    </header>

    <section class="control-panel">
      <div class="control-row">
        <label class="field">
          <span class="field-label">股票代码</span>
          <input type="text" id="symbolInput" placeholder="如 600519 / 000001" value="600519" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">分时周期</span>
          <select id="periodSelect">
            <option value="1">1 分钟</option>
            <option value="5" selected>5 分钟</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">60 分钟</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">回看天数</span>
          <select id="daysSelect">
            <option value="1">1 天</option>
            <option value="3" selected>3 天</option>
            <option value="5">5 天</option>
            <option value="10">10 天</option>
          </select>
        </label>
        <button type="button" class="btn-primary" id="analyzeBtn">分析</button>
      </div>
      <div class="quick-picks" id="quickPicks">
        <span class="quick-label">快捷：</span>
        <button type="button" data-symbol="600519">茅台</button>
        <button type="button" data-symbol="000001">平安</button>
        <button type="button" data-symbol="300750">宁德</button>
        <button type="button" data-symbol="601318">平安保险</button>
        <button type="button" data-symbol="002594">比亚迪</button>
      </div>
    </section>

    <div class="status-bar" id="statusBar">输入股票代码后点击「分析」</div>

    <section class="quote-panel hidden" id="quotePanel">
      <div class="quote-main">
        <div class="quote-name" id="quoteName">—</div>
        <div class="quote-price" id="quotePrice">—</div>
        <div class="quote-change" id="quoteChange">—</div>
      </div>
      <div class="quote-stats">
        <div class="stat"><span>今开</span><b id="statOpen">—</b></div>
        <div class="stat"><span>最高</span><b id="statHigh">—</b></div>
        <div class="stat"><span>最低</span><b id="statLow">—</b></div>
        <div class="stat"><span>昨收</span><b id="statPrev">—</b></div>
        <div class="stat"><span>VWAP</span><b id="statVwap">—</b></div>
        <div class="stat"><span>RSI(14)</span><b id="statRsi">—</b></div>
      </div>
    </section>

    <main class="main-grid">
      <div class="chart-card">
        <div class="card-head">
          <h2>分时走势 & 做T点位</h2>
          <div class="legend">
            <span class="leg buy">● 低吸</span>
            <span class="leg sell">● 高抛</span>
            <span class="leg vwap">— VWAP</span>
          </div>
        </div>
        <canvas id="mainChart" width="900" height="380"></canvas>
      </div>

      <aside class="side-panel">
        <div class="card levels-card">
          <h2>关键价位</h2>
          <div class="levels-grid" id="levelsGrid"></div>
        </div>

        <div class="card signals-card">
          <h2>做T信号 <span class="badge" id="signalCount">0</span></h2>
          <div class="signal-list" id="signalList"></div>
        </div>

        <div class="card strategy-card">
          <h2>策略建议</h2>
          <div class="strategy-body" id="strategyBody"></div>
        </div>
      </aside>
    </main>

    <footer class="footer">
      <p>数据来源：东方财富公开接口 · 仅供学习研究，不构成投资建议 ·
        <a href="https://t5eng.github.io/cursor_workspace/t-trading/">在线地址</a>
      </p>
    </footer>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
